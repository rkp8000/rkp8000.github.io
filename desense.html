<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" type="text/css" href="/aux/desense/style.css">
<title>Desense</title>
<style>
</style>
</head>
<body>

<h1>Desensitize text before editing with AI</h1>

<label>Custom personal names (comma-separated):</label>
<textarea id="customNames" placeholder="e.g. Zachary, Emilia">Bort</textarea>

<label>Custom places (comma-separated):</label>
<textarea id="customPlaces" placeholder="e.g. Princeton, Grand Canyon">Starbonks</textarea>
    
<label>Custom companies (comma-separated):</label>
<textarea id="customCompanies" placeholder="e.g. Markosurf, Torget">Markosoft</textarea>
<br>
<button id="saveInUrlBtn">Save in URL</button> (Then bookmark to save custom names lists.)
<br><br>
<label>Original text:</label>
    
<textarea id="original" placeholder="Paste original email here...">
Hi Jennifer, 

Just wanted to touch base about our upcoming meeting at Starbonks in New York with Robert about our new clients at Netflix, Google and Markosoft.
    
Do you know if Robert has reviewed the portfolio yet?
    
You can reach me at 519-302-5103.

Please also reach out to Richard David ASAP.

Thanks,
Bort
</textarea>

<button id="depersonalizeBtn">Desensitize</button>

<br><br>
<label>Desensitized text:</label>
<textarea id="depersonalized" placeholder="Desensitized text..."></textarea>

<button id="repersonalizeBtn">Resensitize</button>

<br><br>
<label>Resensitized text:</label>
<textarea id="reverted" placeholder="Resensitized text..."></textarea>

<script src="/aux/desense/script.js"></script> 
</body>
</html>
