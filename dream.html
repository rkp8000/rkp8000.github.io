<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dream Cipher</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    label {
      font-size: 14px;
      opacity: 0.8;
    }
    
    textarea {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #020617;
      color: #e5e7eb;
      resize: vertical;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    
    textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
    }
      
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
      
    .row {
      display: flex;
      gap: 16px;
      align-items: stretch;
      flex-direction: column;
    }
    
    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .column.encoded {
      flex: 1;
    }
    
    button {
      margin-top: 10px;
      padding: 10px;
      font-size: 15px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
    }
    
    button:active {
      transform: translateY(0);
      box-shadow: none;
    }
    
    /* Password section spacing */
    #password {
      max-width: 200px;
    }
    
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <div class="container">
      <h1>Dream Cipher</h1>
      <label for="password">Midnight Snack</label>
      <br />
      <textarea id="password" rows="1">mochi</textarea>
        <br />
        <br />
    
      <div class="row">
        <div class="column">
          <label for="message">Secret message</label>
          <textarea id="message" rows="6">Howdy</textarea>
          <br />
          <button onclick="handleEncrypt()">Synthesize</button>
          <br />
        </div>
    
        <div class="column encoded">
          <label for="encoded">Dream</label>
          <textarea id="encoded" rows="30"></textarea>
        </div>
          
        <div class="controls">
        </div>
    
        <div class="column">
          <button onclick="handleDecrypt()">Analyze</button>
          <br />
          <br />
          <label for="decoded">Interpretation</label>
          <textarea id="decoded" rows="6"></textarea>
        </div>
      </div>
  </div>
    
      <script src="/aux/dream/aux.js"></script>
      <script src="/aux/dream/pako.js"></script>
      <script src="/aux/dream/compress.js"></script>
      <script src="/aux/dream/crypt.js"></script>
      <script src="/aux/dream/bird.js"></script>
      <script src="/aux/dream/sing.js"></script>
</body>
</html>
